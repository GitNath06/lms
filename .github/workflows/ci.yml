name: LabSync LIMS CI & Regressions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-test:
    name: Code Quality & Automated Regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Static Type Check
        run: npx tsc --noEmit

      - name: ESLint Code Inspection
        run: npm run lint

      - name: Tier 1: Pure Domain Invariants Unit Suite (<2s runtime)
        run: npm run test:unit
